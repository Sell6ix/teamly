<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Gartic Phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1040"/>
      <stop offset="45%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#f4a261"/>
    </linearGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <!-- sketch pad -->
  <rect x="48" y="70" width="304" height="280" rx="18" fill="#fff8f0"/>
  <rect x="68" y="95" width="264" height="210" rx="8" fill="#ffffff"/>
  <!-- doodle: phone + cat-ish scribble -->
  <rect x="155" y="130" width="90" height="140" rx="14" fill="none" stroke="#2d1b69" stroke-width="6"/>
  <circle cx="200" cy="245" r="6" fill="#2d1b69"/>
  <path d="M100 200 Q140 120 180 190 T260 170 T300 210" fill="none" stroke="#e76f51" stroke-width="5" stroke-linecap="round"/>
  <circle cx="120" cy="280" r="18" fill="none" stroke="#2a9d8f" stroke-width="4"/>
  <path d="M250 280 Q270 250 290 280" fill="none" stroke="#e9c46a" stroke-width="4"/>
  <!-- pencil -->
  <g transform="translate(290 320) rotate(-35)">
    <rect x="0" y="0" width="14" height="90" rx="3" fill="#e9c46a"/>
    <polygon points="0,90 14,90 7,110" fill="#f4a261"/>
    <rect x="0" y="0" width="14" height="16" fill="#e76f51"/>
  </g>
  <rect x="0" y="460" width="400" height="100" fill="#120a28" opacity="0.7"/>
  <text x="28" y="512" fill="#fff" font-family="Georgia, serif" font-size="34" font-weight="700">GARTIC</text>
  <text x="28" y="540" fill="#f4a261" font-family="Georgia, serif" font-size="16">PHONE · рисуй и угадывай</text>
</svg>
