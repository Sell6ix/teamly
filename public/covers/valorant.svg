<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="Valorant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#0d0d12"/>
      <stop offset="55%" stop-color="#1a0a12"/>
      <stop offset="100%" stop-color="#ff4655"/>
    </linearGradient>
    <linearGradient id="v" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ff6b7a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="560" fill="url(#bg)"/>
  <!-- tactical grid -->
  <g stroke="#ff4655" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 140 H400 M0 280 H400 M0 420 H400"/>
    <path d="M80 0 V560 M200 0 V560 M320 0 V560"/>
  </g>
  <!-- agent silhouette / spike -->
  <path d="M70 470 L200 70 L240 70 L110 470 Z" fill="url(#v)"/>
  <path d="M210 470 L300 250 L345 250 L255 470 Z" fill="#ff4655" opacity="0.35"/>
  <!-- spike-ish diamond -->
  <path d="M310 120 L340 150 L310 210 L280 150 Z" fill="#ff4655"/>
  <path d="M310 135 L328 150 L310 185 L292 150 Z" fill="#0d0d12"/>
  <rect x="0" y="460" width="400" height="100" fill="#050508" opacity="0.65"/>
  <text x="28" y="518" fill="#fff" font-family="Arial Black, Impact, sans-serif" font-size="42" letter-spacing="6">VALORANT</text>
  <text x="28" y="542" fill="#ff4655" font-family="Georgia, serif" font-size="12" letter-spacing="3">5v5 TACTICAL</text>
</svg>
