app = "teamly-demo"
primary_region = "ams"

[build]

[env]
  PORT = "3000"
  AUTH_TRUST_HOST = "true"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[mounts]
  source = "teamly_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
